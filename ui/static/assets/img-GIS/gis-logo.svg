<svg width="400" height="220" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo G.I.S">
  <defs>
    <linearGradient id="gisRingGrad" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#2E5590"/>
      <stop offset="35%" stop-color="#3E7FC4"/>
      <stop offset="100%" stop-color="#9FCBEE"/>
    </linearGradient>
    <linearGradient id="gisTextGrad" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#2E5590"/>
      <stop offset="50%" stop-color="#3170AE"/>
      <stop offset="100%" stop-color="#84B9E4"/>
    </linearGradient>
  </defs>

  <!-- anillo (recreado de gis-v9), tonos celestes, sin contornos blancos -->
  <ellipse cx="200" cy="112" rx="180" ry="82" fill="none" stroke="url(#gisRingGrad)" stroke-width="27"/>

  <!-- estrella -->
  <path d="M76 66 L83 86 L103 91 L83 96 L76 116 L69 96 L49 91 L69 86 Z" fill="#BFE3FB"/>

  <!-- cluster de pixeles -->
  <g fill="#3E7FC4">
    <rect x="326" y="30" width="9" height="9"/>
    <rect x="342" y="30" width="9" height="9"/>
    <rect x="358" y="30" width="9" height="9" opacity=".85"/>
    <rect x="326" y="46" width="9" height="9"/>
    <rect x="342" y="46" width="9" height="9" opacity=".7"/>
    <rect x="326" y="62" width="9" height="9" opacity=".55"/>
  </g>

  <!-- texto -->
  <text x="205" y="126" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-style="italic" font-size="50" fill="url(#gisTextGrad)">G.I.S</text>
</svg>
