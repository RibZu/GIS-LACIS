<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GIS-LACIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/static/css-GIS/Styleheader.css">
    <link rel="stylesheet" href="/ui/static/css-GIS/style.css">
    <link rel="stylesheet" href="/ui/static/css-GIS/usuarios.css">
</head>
<body class="grilla">
    <header>
        {{ template "nav" . }}
    </header>
    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card login-card mt-5">
                        <div class="card-header">
                            <span class="eyebrow">GIS&#8209;LACIS &middot; Panel interno</span>
                            <h4>Acceso Administrador</h4>
                        </div>
                        <div class="card-body">
                            {{ if .Error }}
                            <div class="alert alert-danger">{{ .Error }}</div>
                            {{ end }}
                            <form action="/login" method="POST">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Usuario</label>
                                    <input type="text" class="form-control" id="username" name="username" required value="admin">
                                </div>
                                <div class="mb-4">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="password" name="password" required value="admin123">
                                        <button class="btn btn-outline-secondary" type="button" data-toggle-password data-target="password" aria-label="Mostrar contraseña" tabindex="-1">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-institucional">Ingresar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="text-white pb-4 bg-dark">
        {{ template "footer" . }}
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/ui/static/js-GIS/toggle-password.js"></script>
</body>
</html>
