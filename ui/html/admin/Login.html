<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GIS-LACIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/ui/static/css-GIS/Styleheader.css">
    <link rel="stylesheet" href="/ui/static/css-GIS/style.css">
    <style>
        body { background-color: var(--azul-pastel-fondo); }
        .login-card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-header { background-color: var(--azul-logo); color: white; border-radius: 15px 15px 0 0; }
    </style>
</head>
<body class="grilla">
    <header>
        {{ template "nav" . }}
    </header>
    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card login-card mt-5">
                        <div class="card-header login-header text-center py-4">
                            <h4>Acceso Administrador</h4>
                        </div>
                        <div class="card-body p-4">
                            {{ if .Error }}
                            <div class="alert alert-danger">{{ .Error }}</div>
                            {{ end }}
                            <form action="/login" method="POST">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Usuario</label>
                                    <input type="text" class="form-control" id="username" name="username" required value="admin">
                                </div>
                                <div class="mb-4">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" required value="admin123">
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary" style="background-color: var(--azul-logo); border-color: var(--azul-logo);">Ingresar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="text-white pb-4 bg-dark">
        {{ template "footer" . }}
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
