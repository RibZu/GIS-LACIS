<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de gestion de Proyectos</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="../../static/assets/img-GIS/ing.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos -->
    <link rel="stylesheet" href="/static/css-GIS/Styleheader.css">
    <link rel="stylesheet" href="/static/css-GIS/style.css">
    <link rel="stylesheet" href="/static/css-GIS/abm-proyectos.css">
</head>

<body>

    <!-- NAVBAR ADMIN -->
    <nav class="navbar navbar-expand-lg admin-header py-3 bg-white border-bottom shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/admin/dashboard">
                <img src="/static/assets/img-GIS/SE.png" alt="Logo SEG" height="38" onerror="this.style.display='none'">
                <div>
                    <span class="fw-bold fs-5 text-dark d-block lh-1">GIS-LACIS <span class="badge bg-primary ms-1"
                            style="font-size: 0.65rem;">ADMIN</span></span>
                    <small class="text-muted" style="font-size: 0.75rem;">Gestión de Proyectos I+D+i</small>
                </div>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="/admin/dashboard" class="btn btn-sm btn-outline-secondary rounded-pill px-3"><i
                        class="bi bi-arrow-left"></i> Volver al Dashboard</a>
                <a href="/proyectos" target="_blank" class="btn btn-sm btn-outline-primary rounded-pill px-3"><i
                        class="bi bi-eye"></i> Ver Web Pública</a>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 my-4 flex-grow-1">

        <!-- BARRA DE FILTROS Y BOTÓN CREAR -->
        <div class="admin-card p-3 mb-4">
            <div class="row g-3 align-items-center justify-content-between">
                <div class="col-12 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="bi bi-search text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" id="inputBuscar"
                            placeholder="Buscar proyectos por título o equipo...">
                    </div>
                </div>
                <div class="col-12 col-md-6 d-flex flex-wrap justify-content-md-end gap-3 align-items-center">
                    <select class="form-select w-auto" id="selectOrden">
                        <option value="recientes">Más recientes primero</option>
                        <option value="antiguos">Más antiguos primero</option>
                        <option value="titulo">Alfabético A-Z</option>
                    </select>
                    <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" onclick="abrirDrawerCrear()">
                        <i class="bi bi-plus-circle me-1"></i> Crear Proyecto
                    </button>
                </div>
            </div>
        </div>

        <!-- GRID DE TARJETAS -->
        <div class="row g-4" id="cardsGrid">
            <!-- Tarjetas inyectadas dinámicamente -->
        </div>

        <!-- Estado Vacío -->
        <div id="emptyState" class="text-center py-5 d-none">
            <div class="text-muted mb-3"><i class="bi bi-folder-x fs-1 text-secondary"></i></div>
            <h5 class="text-dark fw-bold">No se encontraron proyectos</h5>
            <p class="text-muted small">Prueba cambiando los filtros o agrega un proyecto nuevo.</p>
        </div>

    </main>

    <!-- OFFCANVAS DRAWER LATERAL PARA CREAR / EDITAR -->
    <div class="offcanvas offcanvas-end rounded-start-4 shadow-lg border-0" tabindex="-1" id="drawerProyecto"
        style="width: 500px; max-width: 90vw;">
        <div class="offcanvas-header bg-light border-bottom py-3">
            <h5 class="offcanvas-title fw-bold text-dark d-flex align-items-center gap-2" id="drawerTitulo">
                <i class="bi bi-pencil-square text-primary"></i> <span>Proyecto</span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-4">
            <form id="formProyecto">
                <input type="hidden" id="formId">

                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted text-uppercase">Título del Proyecto *</label>
                    <textarea class="form-control" id="formTitulo" rows="3" required
                        placeholder="Ej: Elaboración de Métodos para Desarrollo Seguro"></textarea>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-bold small text-muted text-uppercase">Año Inicio *</label>
                        <input type="number" class="form-control" id="formAnioInicio" required min="1990" max="2100"
                            value="2024">
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold small text-muted text-uppercase">Año Fin *</label>
                        <input type="number" class="form-control" id="formAnioFin" required min="1990" max="2100"
                            value="2026">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted text-uppercase">Equipo Histórico /
                        Dirección</label>
                    <input type="text" class="form-control" id="formEquipo"
                        placeholder="Ej: Dr. Mario Berón, Mg. Norma Pérez">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted text-uppercase">Descripción / Objetivos</label>
                    <textarea class="form-control" id="formDescripcion" rows="4"
                        placeholder="Breve resumen del proyecto, formalismos, tecnologías aplicadas..."></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-muted text-uppercase">Enlace Web / Repositorio
                        (Opcional)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-link-45deg"></i></span>
                        <input type="url" class="form-control" id="formEnlace" placeholder="https://lacis.unsl.edu.ar">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <button type="button" class="btn btn-light border rounded-pill px-4"
                        data-bs-dismiss="offcanvas">Cancelar</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold"
                        id="btnGuardarDrawer">Guardar Proyecto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN PARA ELIMINAR -->
    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-body text-center p-4">
                    <div class="text-danger mb-3"><i class="bi bi-exclamation-octagon fs-1"></i></div>
                    <h5 class="fw-bold mb-2">¿Eliminar Proyecto?</h5>
                    <p class="text-muted small mb-4">Esta acción eliminará el registro permanentemente.</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-light border rounded-pill px-3 py-2"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger rounded-pill px-3 py-2"
                            id="btnConfirmarEliminar">Sí, Eliminar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-bg-success border-0 shadow" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Operación realizada con éxito.</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js-GIS/abmProyectos.js"></script>
</body>

</html>
