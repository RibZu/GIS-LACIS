<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nuevo Integrante - Admin</title>
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
   
    <link rel="stylesheet" href="/ui/static/css-GIS/Styleheader.css">
    <link rel="stylesheet" href="/ui/static/css-GIS/style.css">
    <link  rel="stylesheet" href="/ui/static/css-GIS/admin.css" >
</head>
<body>

    <!-- Header / Navbar Compartido -->
    {{ template "nav" . }}

    <main class="container my-5">
        
        <div class="form-card">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">Ingresar Nuevo Integrante</h3>
                    <p class="text-muted mb-0 fs-6">El nuevo registro se guardará directamente en la base de datos <strong>PostgreSQL</strong></p>
                </div>
                <a href="/admin/integrantes" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i> Volver a la Lista
                </a>
            </div>

            {{ if .Error }}
            <div class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ .Error }}
            </div>
            {{ end }}

         
            <form action="/admin/insertar-integrante" method="POST" enctype="multipart/form-data">
                <div class="row g-3">
                    
                    
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Corina" required>
                    </div>

                  
                    <div class="col-md-6">
                        <label for="apellido" class="form-label">Apellido <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Ej: Abdelahad" required>
                    </div>

                  
                    <div class="col-md-6">
                        <label for="rol_id" class="form-label">Rol / Cargo <span class="text-danger">*</span></label>
                        <select class="form-select" id="rol_id" name="rol_id" required>
                            <option value="" selected disabled>Seleccionar Rol...</option>
                            <option value="1">1 - INVESTIGADOR</option>
                            <option value="2">2 - DIRECTOR</option>
                            <option value="3">3 - ESTUDIANTE / BECARIO</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="contacto" class="form-label">Contacto / Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="contacto" name="contacto" placeholder="Ej: usuario@email.unsl.edu.ar" required>
                    </div>

                  
                    <div class="col-md-6">
                        <label for="imagen" class="form-label">Foto de Perfil (Imagen)</label>
                        <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                    </div>

            
                    <div class="col-md-6">
                        <label for="cv" class="form-label">Archivo de CV (PDF)</label>
                        <input type="file" class="form-control" id="cv" name="cv" accept=".pdf">
                    </div>

                 
                    <div class="col-12">
                        <label for="especializacion" class="form-label">Especialización <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="especializacion" name="especializacion" placeholder="Ej: Modelos, Transformación de Modelos, Ciberseguridad" required>
                    </div>

                 
                    <div class="col-12">
                        <label for="descripcion" class="form-label">Descripción / Biografía <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="3" placeholder="Ej: Profesor Adjunto e Investigador en el Departamento de Informática FCFMyN (UNSL)" required></textarea>
                    </div>

                </div>

             
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="/admin/integrantes" class="btn btn-light border px-4">Cancelar</a>
                    <button type="submit" class="btn btn-guardar d-inline-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill"></i> Guardar en PostgreSQL
                    </button>
                </div>
            </form>

        </div>

    </main>

    <!-- Footer Compartido -->
    {{ template "footer" . }}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
