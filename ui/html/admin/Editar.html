<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Integrante - Admin</title>
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    

    <link rel="stylesheet" href="/ui/static/css-GIS/Styleheader.css">
    <link rel="stylesheet" href="/ui/static/css-GIS/style.css">
    <link  rel="stylesheet" href="/ui/static/css-GIS/actualizar.css" >
</head>
<body>

    <!-- Header / Navbar Compartido -->
    {{ template "nav" . }}

    <main class="container my-5">
        
        <div class="form-card">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">Editar Integrante #{{ .Integrante.ID }}</h3>
                    <p class="text-muted mb-0 fs-6">Modifica los datos guardados en la base de datos <strong>PostgreSQL</strong></p>
                </div>
                <a href="/admin/integrantes" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i> Volver a la Lista
                </a>
            </div>

            {{ if .Error }}
            <div class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ .Error }}
            </div>
            {{ end }}

          
            <form action="/admin/actualizar-integrante" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="id" value="{{ .Integrante.ID }}">

                <div class="row g-3">
                    
                    
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ .Integrante.Nombre }}" required>
                    </div>

              
                    <div class="col-md-6">
                        <label for="apellido" class="form-label">Apellido <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="apellido" name="apellido" value="{{ .Integrante.Apellido }}" required>
                    </div>

                  
                    <div class="col-md-6">
                        <label for="rol_id" class="form-label">Rol / Cargo <span class="text-danger">*</span></label>
                        <select class="form-select" id="rol_id" name="rol_id" required>
                            <option value="1" {{ if eq .Integrante.RolID 1 }}selected{{ end }}>1 - INVESTIGADOR</option>
                            <option value="2" {{ if eq .Integrante.RolID 2 }}selected{{ end }}>2 - DIRECTOR</option>
                            <option value="3" {{ if eq .Integrante.RolID 3 }}selected{{ end }}>3 - ESTUDIANTE / BECARIO</option>
                        </select>
                    </div>

                
                    <div class="col-md-6">
                        <label for="contacto" class="form-label">Contacto / Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="contacto" name="contacto" value="{{ .Integrante.Contacto }}" required>
                    </div>

                
                    <div class="col-md-6">
                        <label for="imagen" class="form-label">Cambiar Foto de Perfil (Opcional)</label>
                        <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                        <small class="text-muted d-block mt-1">Ruta actual: <span class="fw-semibold text-break">{{ .Integrante.Imagen }}</span></small>
                    </div>

                
                    <div class="col-md-6">
                        <label for="cv" class="form-label">Cambiar Archivo de CV PDF (Opcional)</label>
                        <input type="file" class="form-control" id="cv" name="cv" accept=".pdf">
                        <small class="text-muted d-block mt-1">Ruta actual: <span class="fw-semibold text-break">{{ .Integrante.CV }}</span></small>
                    </div>

                 
                    <div class="col-12">
                        <label for="especializacion" class="form-label">Especialización <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="especializacion" name="especializacion" value="{{ .Integrante.Especializacion }}" required>
                    </div>

                
                    <div class="col-12">
                        <label for="descripcion" class="form-label">Descripción / Biografía <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required>{{ .Integrante.Descripcion }}</textarea>
                    </div>

                </div>

            
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="/admin/integrantes" class="btn btn-light border px-4">Cancelar</a>
                    <button type="submit" class="btn btn-guardar d-inline-flex align-items-center gap-2">
                        <i class="bi bi-save-fill"></i> Actualizar en PostgreSQL
                    </button>
                </div>
            </form>

        </div>

    </main>

    <!-- Footer Compartido -->
    {{ template "footer" . }}

 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
