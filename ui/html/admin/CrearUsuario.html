<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nuevo Usuario - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/ui/static/css-GIS/Styleheader.css">
    <link rel="stylesheet" href="/ui/static/css-GIS/style.css">
    <link rel="stylesheet" href="/ui/static/css-GIS/usuarios.css">
</head>
<body>

    <!-- Header / Navbar Compartido -->
    {{ template "nav" . }}

    <main class="py-5">
    <div class="container">

        <div class="form-card">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">Nuevo Usuario</h3>
                </div>
                <a href="/admin/usuarios" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i> Volver a la Lista
                </a>
            </div>

            {{ if .Error }}
            <div class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ .Error }}
            </div>
            {{ end }}

            <form action="/admin/insertar-usuario" method="POST">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="username" class="form-label">Usuario <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Ej: jperez" pattern="\S+" title="Sin espacios" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Ej: jperez@unsl.edu.ar" required>
                    </div>

                    <div class="col-md-6">
                        <label for="password" class="form-label">Contraseña <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" required>
                            <button class="btn btn-outline-secondary" type="button" data-toggle-password data-target="password" aria-label="Mostrar contraseña" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="password_confirm" class="form-label">Repetir Contraseña <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm" required>
                            <button class="btn btn-outline-secondary" type="button" data-toggle-password data-target="password_confirm" aria-label="Mostrar contraseña" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label d-block">Módulos de acceso <span class="text-danger">*</span></label>
                        <p class="text-muted small mb-2">El rol se calcula solo: un módulo → nombre de ese módulo. Dos o más → GESTOR.</p>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="modulos" value="integrantes" id="mod-integrantes">
                            <label class="form-check-label" for="mod-integrantes">Integrantes</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="modulos" value="proyectos" id="mod-proyectos">
                            <label class="form-check-label" for="mod-proyectos">Proyectos I+D+i</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="modulos" value="reconocimientos" id="mod-reconocimientos">
                            <label class="form-check-label" for="mod-reconocimientos">Reconocimientos</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="modulos" value="empresas" id="mod-empresas">
                            <label class="form-check-label" for="mod-empresas">Empresas Colaboradoras</label>
                        </div>
                    </div>

                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="/admin/usuarios" class="btn btn-light border px-4">Cancelar</a>
                    <button type="submit" class="btn btn-guardar d-inline-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill"></i> Guardar Usuario
                    </button>
                </div>
            </form>

        </div>

    </div>
    </main>

    <!-- Footer Compartido -->
    {{ template "footer" . }}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/ui/static/js-GIS/toggle-password.js"></script>
</body>
</html>
