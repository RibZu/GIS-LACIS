<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Titulo }} - GIS-LACIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/static/css-GIS/Styleheader.css">
    <link rel="stylesheet" href="/ui/static/css-GIS/style.css">
    <link rel="stylesheet" href="/ui/static/css-GIS/usuarios.css">
</head>
<body class="grilla">
    <header>
        {{ template "nav" . }}
    </header>
    <main class="d-flex align-items-center justify-content-center py-5">
        <div class="container text-center py-5">
            <i class="bi bi-exclamation-circle display-4 text-muted" aria-hidden="true"></i>
            <h1 class="h3 mt-3">{{ .Titulo }}</h1>
            <p class="text-muted mb-4" role="alert">{{ .Mensaje }}</p>
            <a href="/" class="btn btn-institucional">Volver al inicio</a>
        </div>
    </main>
    <footer class="text-white pb-4 bg-dark">
        {{ template "footer" . }}
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
